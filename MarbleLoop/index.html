<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marble Loop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <header class="hud">
            <h1>MARBLE LOOP</h1>
            <div class="stats">
                <div class="stat"><span class="label">Score</span><span id="score">0</span></div>
                <div class="stat"><span class="label">Level</span><span id="level">1</span></div>
                <div class="stat"><span class="label">Left</span><span id="remaining">0</span></div>
                <div class="stat"><span class="label">Best</span><span id="best">0</span></div>
            </div>
        </header>

        <div class="board-wrap">
            <canvas id="canvas" width="640" height="480"></canvas>
            <div id="overlay" class="overlay visible">
                <h2 id="overlay-title">MARBLE LOOP</h2>
                <p id="overlay-score"></p>
                <p id="overlay-sub">Press Space or click Start to play</p>
                <button id="btn-start">Start Game</button>
            </div>
        </div>

        <div class="help">
            <p>mouse to aim</p>
            <p>click or <kbd>Space</kbd> to fire</p>
            <p><kbd>←</kbd> <kbd>→</kbd> rotate</p>
            <p><kbd>S</kbd> swap</p>
            <p><kbd>P</kbd> pause</p>
        </div>
    </main>

    <script src="game.js"></script>
    <script src="../shared/touch-controls.js"></script>
    <script>
        TouchControls.init({
            help: '.help',
            drag: { target: '#canvas', releaseClick: true },
            buttons: [{ label: 'Swap', key: 's' }, { label: '❚❚', key: 'p', aria: 'Pause', small: true }],
            hint: 'Touch and drag to aim, lift to fire · Swap · ❚❚ pause',
            say: [['Press Space or click Start to play', 'Tap Start to play'], [/click or Space to fire/g, 'drag and lift to fire'], [/Press Space/g, 'Tap Start'], [/Press P/g, 'Tap ❚❚']],
        });
    </script>
</body>
</html>
