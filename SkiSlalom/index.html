<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ski Slalom</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <header class="hud">
            <h1>SKI SLALOM</h1>
            <div class="stats">
                <div class="stat"><span class="label">Time</span><span id="time">0.00</span></div>
                <div class="stat"><span class="label">Gates</span><span id="gates">0/16</span></div>
                <div class="stat"><span class="label">Penalty</span><span id="penalty">0.0</span></div>
                <div class="stat"><span class="label">Falls</span><span id="crashes">0</span></div>
                <div class="stat"><span class="label">km/h</span><span id="speed">0</span></div>
                <div class="stat"><span class="label">Best</span><span id="best">--</span></div>
            </div>
        </header>

        <div class="board-wrap">
            <canvas id="canvas" width="480" height="640"></canvas>
            <div id="overlay" class="overlay visible">
                <h2 id="overlay-title">SKI SLALOM</h2>
                <p id="overlay-score"></p>
                <p id="overlay-sub">Press Space or click Start to drop in</p>
                <button id="btn-start">Start Run</button>
            </div>
        </div>

        <div class="help">
            <p><kbd>←</kbd> <kbd>→</kbd> carve</p>
            <p><kbd>Space</kbd> start / restart</p>
            <p><kbd>P</kbd> pause</p>
            <p>Ski between the poles &mdash; a missed gate costs 3s</p>
        </div>
    </main>

    <script src="game.js"></script>
</body>
</html>
