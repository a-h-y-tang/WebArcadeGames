<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ski Slalom</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <header class="hud">
            <h1>SKI SLALOM</h1>
            <div class="stats">
                <div class="stat"><span class="label">Run</span><span id="run">1</span></div>
                <div class="stat"><span class="label">Time</span><span id="time">0.0</span></div>
                <div class="stat"><span class="label">Gates</span><span id="gates">0/12</span></div>
                <div class="stat"><span class="label">Lives</span><span id="lives">3</span></div>
                <div class="stat"><span class="label">Score</span><span id="score">0</span></div>
                <div class="stat"><span class="label">Best</span><span id="best">0</span></div>
            </div>
        </header>

        <div class="board-wrap">
            <canvas id="canvas" width="600" height="400"></canvas>
            <div id="overlay" class="overlay visible">
                <h2 id="overlay-title">SKI SLALOM</h2>
                <p id="overlay-score"></p>
                <p id="overlay-sub">Press Space or click Start to drop in</p>
                <button id="btn-start">Start Run</button>
            </div>
        </div>

        <div class="help">
            <p><kbd>&larr;</kbd> <kbd>&rarr;</kbd> carve</p>
            <p><kbd>&darr;</kbd> tuck for speed</p>
            <p>mouse to steer</p>
            <p><kbd>Space</kbd> start</p>
            <p><kbd>P</kbd> pause</p>
        </div>
    </main>

    <script src="game.js"></script>
</body>
</html>
