<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaxxon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <header class="hud">
            <h1>ZAXXON</h1>
            <div class="stats">
                <div class="stat"><span class="label">Score</span><span id="score">0</span></div>
                <div class="stat"><span class="label">Level</span><span id="level">1</span></div>
                <div class="stat"><span class="label">Ships</span><span id="lives">3</span></div>
                <div class="stat"><span class="label">Fuel</span><span id="fuel">100</span></div>
                <div class="stat"><span class="label">Best</span><span id="best">0</span></div>
            </div>
        </header>

        <div class="board-wrap">
            <canvas id="canvas" width="480" height="640"></canvas>
            <div id="overlay" class="overlay visible">
                <h2 id="overlay-title">ZAXXON</h2>
                <p id="overlay-score"></p>
                <p id="overlay-sub">Press Space or click Start to play</p>
                <button id="btn-start">Start Game</button>
            </div>
        </div>

        <div class="help">
            <p><kbd>&larr;</kbd> <kbd>&rarr;</kbd> / <kbd>A</kbd> <kbd>D</kbd> steer</p>
            <p><kbd>&uarr;</kbd> <kbd>&darr;</kbd> / <kbd>W</kbd> <kbd>S</kbd> climb &amp; dive</p>
            <p><kbd>Space</kbd> fire</p>
            <p><kbd>P</kbd> pause</p>
            <p>Your altitude is your aim &mdash; fly low to hit the deck, level up to meet a fighter.</p>
        </div>
    </main>

    <script src="game.js"></script>
</body>
</html>
