<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paratrooper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <header class="hud">
            <h1>PARATROOPER</h1>
            <div class="stats">
                <div class="stat"><span class="label">Score</span><span id="score">0</span></div>
                <div class="stat"><span class="label">Best</span><span id="best">0</span></div>
                <div class="stat"><span class="label">Wave</span><span id="wave">1</span></div>
                <div class="stat"><span class="label">Stack L</span><span id="stack-left">0</span></div>
                <div class="stat"><span class="label">Stack R</span><span id="stack-right">0</span></div>
            </div>
        </header>

        <div class="board-wrap">
            <canvas id="canvas" width="640" height="420"></canvas>
            <div id="overlay" class="overlay visible">
                <h2 id="overlay-title">PARATROOPER</h2>
                <p id="overlay-score"></p>
                <p id="overlay-sub">Press Space or click Start to defend the tower</p>
                <button id="btn-start">Start Defence</button>
            </div>
        </div>

        <div class="help">
            <p><kbd>←</kbd> <kbd>→</kbd> swing the gun</p>
            <p><kbd>Space</kbd> fire / start</p>
            <p><kbd>P</kbd> pause</p>
            <p><kbd>R</kbd> restart</p>
            <p>Four troopers stacked on one side storm the tower</p>
        </div>
    </main>

    <script src="game.js"></script>
</body>
</html>
