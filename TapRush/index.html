<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tap Rush</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <header class="hud">
            <h1>TAP RUSH</h1>
            <div class="stats">
                <div class="stat"><span class="label">Score</span><span id="score">0</span></div>
                <div class="stat"><span class="label">Wave</span><span id="level">1</span></div>
                <div class="stat"><span class="label">Lives</span><span id="lives">3</span></div>
                <div class="stat"><span class="label">Served</span><span id="served">0</span></div>
                <div class="stat"><span class="label">Best</span><span id="best">0</span></div>
            </div>
        </header>

        <div class="board-wrap">
            <canvas id="canvas" width="640" height="480"></canvas>
            <div id="overlay" class="overlay visible">
                <h2 id="overlay-title">TAP RUSH</h2>
                <p id="overlay-score"></p>
                <p id="overlay-sub">Press Space or click Start to play</p>
                <button id="btn-start">Start Game</button>
            </div>
        </div>

        <div class="help">
            <p><kbd>&uarr;</kbd> <kbd>&darr;</kbd> / <kbd>W</kbd> <kbd>S</kbd> change counter</p>
            <p><kbd>Space</kbd> pour a mug &nbsp;&middot;&nbsp; <kbd>P</kbd> pause</p>
            <p>Serve every patron, catch every empty &mdash; a mug off either end costs a life.</p>
        </div>
    </main>

    <script src="game.js"></script>
</body>
</html>
