<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>River Raid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <header class="hud">
            <h1>RIVER RAID</h1>
            <div class="stats">
                <div class="stat"><span class="label">Score</span><span id="score">0</span></div>
                <div class="stat"><span class="label">Section</span><span id="section">1</span></div>
                <div class="stat"><span class="label">Jets</span><span id="lives">3</span></div>
                <div class="stat"><span class="label">Fuel</span><span id="fuel">100%</span></div>
                <div class="stat"><span class="label">Best</span><span id="best">0</span></div>
            </div>
        </header>

        <div class="fuel-track"><div id="fuel-bar" class="fuel-bar"></div></div>

        <div class="board-wrap">
            <canvas id="canvas" width="480" height="600"></canvas>
            <div id="overlay" class="overlay visible">
                <h2 id="overlay-title">RIVER RAID</h2>
                <p id="overlay-score"></p>
                <p id="overlay-sub">Press Space or click Start to fly</p>
                <button id="btn-start">Start Game</button>
            </div>
        </div>

        <div class="help">
            <p><kbd>&larr;</kbd> <kbd>&rarr;</kbd> steer</p>
            <p><kbd>&uarr;</kbd> <kbd>&darr;</kbd> throttle</p>
            <p><kbd>Space</kbd> fire</p>
            <p><kbd>P</kbd> pause</p>
        </div>
    </main>

    <script src="game.js"></script>
</body>
</html>
