<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scramble</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <header class="hud">
            <h1>SCRAMBLE</h1>
            <div class="stats">
                <div class="stat"><span class="label">Score</span><span id="score">0</span></div>
                <div class="stat"><span class="label">Level</span><span id="level">1</span></div>
                <div class="stat"><span class="label">Lives</span><span id="lives">3</span></div>
                <div class="stat"><span class="label">Fuel</span><span id="fuel">100</span></div>
                <div class="stat"><span class="label">Best</span><span id="best">0</span></div>
            </div>
        </header>

        <div class="gauge" title="Fuel">
            <div id="fuel-bar" class="gauge-fill" style="width: 100%"></div>
        </div>

        <div class="board-wrap">
            <canvas id="canvas" width="640" height="400"></canvas>
            <div id="overlay" class="overlay visible">
                <h2 id="overlay-title">SCRAMBLE</h2>
                <p id="overlay-score"></p>
                <p id="overlay-sub">Press Space or click Start to play</p>
                <button id="btn-start">Start Game</button>
            </div>
        </div>

        <div class="help">
            <p><kbd>↑</kbd> <kbd>↓</kbd> fly up and down</p>
            <p><kbd>←</kbd> <kbd>→</kbd> steer back and forth</p>
            <p><kbd>Space</kbd> fire laser</p>
            <p><kbd>B</kbd> drop bomb</p>
            <p><kbd>P</kbd> pause</p>
        </div>
    </main>

    <script src="game.js"></script>
</body>
</html>
