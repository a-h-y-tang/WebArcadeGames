<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rally-X</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <header class="hud">
            <h1>RALLY&#8209;X</h1>
            <div class="stats">
                <div class="stat"><span class="label">Score</span><span id="score">0</span></div>
                <div class="stat"><span class="label">Level</span><span id="level">1</span></div>
                <div class="stat"><span class="label">Lives</span><span id="lives">3</span></div>
                <div class="stat"><span class="label">Flags</span><span id="flags">10</span></div>
                <div class="stat"><span class="label">Fuel</span><span id="fuel">100</span></div>
                <div class="stat"><span class="label">Best</span><span id="best">0</span></div>
            </div>
        </header>

        <div class="play">
            <div class="board-wrap">
                <canvas id="canvas" width="560" height="460"></canvas>
                <div id="overlay" class="overlay visible">
                    <h2 id="overlay-title">RALLY-X</h2>
                    <p id="overlay-score"></p>
                    <p id="overlay-sub">Press Space or click Start to play</p>
                    <button id="btn-start">Start Game</button>
                </div>
            </div>

            <aside class="side">
                <h2 class="side-title">Radar</h2>
                <canvas id="radar" width="168" height="136"></canvas>
                <div class="gauge">
                    <span class="label">Fuel</span>
                    <div class="gauge-track"><div id="fuel-bar" class="gauge-fill"></div></div>
                </div>
                <ul class="legend">
                    <li><i class="dot you"></i>Your car</li>
                    <li><i class="dot foe"></i>Pursuers</li>
                    <li><i class="dot flag"></i>Flags</li>
                </ul>
            </aside>
        </div>

        <div class="help">
            <p><kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd> or <kbd>WASD</kbd> steer</p>
            <p><kbd>Space</kbd> smoke screen</p>
            <p><kbd>P</kbd> pause</p>
        </div>
    </main>

    <script src="game.js"></script>
</body>
</html>
