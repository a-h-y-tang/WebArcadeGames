<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rally-X</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <header class="hud">
            <h1>RALLY-X</h1>
            <div class="stats">
                <div class="stat"><span class="label">Score</span><span id="score">0</span></div>
                <div class="stat"><span class="label">Best</span><span id="best">0</span></div>
                <div class="stat"><span class="label">Level</span><span id="level">1</span></div>
                <div class="stat"><span class="label">Cars</span><span id="lives">3</span></div>
                <div class="stat"><span class="label">Flags</span><span id="flags">8</span></div>
            </div>
        </header>

        <div class="table">
            <div class="board-wrap">
                <canvas id="canvas" width="560" height="420"></canvas>
                <div id="overlay" class="overlay visible">
                    <h2 id="overlay-title">RALLY-X</h2>
                    <p id="overlay-score"></p>
                    <p id="overlay-sub">Press Space or click Start to play</p>
                    <button id="btn-start">Start Race</button>
                </div>
            </div>

            <aside class="panel">
                <h2 class="panel-title">Radar</h2>
                <canvas id="radar" width="180" height="180"></canvas>

                <div class="gauge">
                    <div class="gauge-head"><span>Fuel</span><span id="fuel-pct">100%</span></div>
                    <div class="gauge-track"><div id="fuel-bar" class="gauge-bar" style="width: 100%"></div></div>
                </div>

                <ul class="legend">
                    <li><span class="dot dot-car"></span>Your car</li>
                    <li><span class="dot dot-foe"></span>Chase cars</li>
                    <li><span class="dot dot-flag"></span>Flags</li>
                    <li><span class="dot dot-special"></span>Special flag (2x)</li>
                </ul>
            </aside>
        </div>

        <div class="help">
            <p><kbd>←</kbd> <kbd>↑</kbd> <kbd>↓</kbd> <kbd>→</kbd> / <kbd>WASD</kbd> steer</p>
            <p><kbd>Space</kbd> smoke screen</p>
            <p><kbd>P</kbd> pause</p>
            <p>Collect every flag — smoke spins out the chasers</p>
        </div>
    </main>

    <script src="game.js"></script>
</body>
</html>
