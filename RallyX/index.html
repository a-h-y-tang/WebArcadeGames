<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rally-X</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <header class="hud">
            <h1>RALLY-X</h1>
            <div class="stats">
                <div class="stat"><span class="label">Score</span><span id="score">0</span></div>
                <div class="stat"><span class="label">Level</span><span id="level">1</span></div>
                <div class="stat"><span class="label">Flags</span><span id="flags">0</span></div>
                <div class="stat"><span class="label">Fuel</span><span id="fuel">100</span></div>
                <div class="stat"><span class="label">Cars</span><span id="lives">3</span></div>
                <div class="stat"><span class="label">Best</span><span id="best">0</span></div>
            </div>
        </header>

        <div class="board-wrap">
            <canvas id="canvas" width="600" height="360"></canvas>
            <div id="overlay" class="overlay visible">
                <h2 id="overlay-title">RALLY-X</h2>
                <p id="overlay-score"></p>
                <p id="overlay-sub">Press Space or click Start to play</p>
                <button id="btn-start">Start Game</button>
            </div>
        </div>

        <div class="help">
            <p><kbd>←</kbd> <kbd>→</kbd> <kbd>↑</kbd> <kbd>↓</kbd> steer</p>
            <p><kbd>Space</kbd> smoke screen</p>
            <p><kbd>P</kbd> pause</p>
        </div>

        <p class="tip">Collect every flag before the tank runs dry. The radar shows the whole course — lay smoke to spin out the red cars chasing you.</p>
    </main>

    <script src="game.js"></script>
</body>
</html>
