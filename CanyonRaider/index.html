<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canyon Raider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <header class="hud">
            <h1>CANYON RAIDER</h1>
            <div class="stats">
                <div class="stat"><span class="label">Score</span><span id="score">0</span></div>
                <div class="stat"><span class="label">Best</span><span id="best">0</span></div>
                <div class="stat"><span class="label">Lives</span><span id="lives">3</span></div>
                <div class="stat"><span class="label">Section</span><span id="section">1</span></div>
                <div class="stat"><span class="label">Distance</span><span id="distance">0</span></div>
            </div>
            <div class="fuel">
                <span class="label">Fuel</span>
                <div class="fuel-track"><div id="fuel-bar" class="fuel-bar" style="width: 100%"></div></div>
            </div>
        </header>

        <div class="board-wrap">
            <canvas id="canvas" width="480" height="640"></canvas>
            <div id="overlay" class="overlay visible">
                <h2 id="overlay-title">CANYON RAIDER</h2>
                <p id="overlay-score"></p>
                <p id="overlay-sub">Press Space or click Start to fly</p>
                <button id="btn-start">Start Run</button>
            </div>
        </div>

        <div class="help">
            <p><kbd>←</kbd> <kbd>→</kbd> steer</p>
            <p><kbd>↑</kbd> <kbd>↓</kbd> throttle</p>
            <p><kbd>Space</kbd> fire / start</p>
            <p><kbd>P</kbd> pause</p>
            <p>Fly over depots to refuel</p>
        </div>
    </main>

    <script src="game.js"></script>
</body>
</html>
