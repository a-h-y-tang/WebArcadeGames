<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soda Slinger</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <header class="hud">
            <h1>SODA SLINGER</h1>
            <div class="stats">
                <div class="stat"><span class="label">Score</span><span id="score">0</span></div>
                <div class="stat"><span class="label">Level</span><span id="level">1</span></div>
                <div class="stat"><span class="label">Lives</span><span id="lives">3</span></div>
                <div class="stat"><span class="label">Served</span><span id="served">0 / 8</span></div>
                <div class="stat"><span class="label">Best</span><span id="best">0</span></div>
            </div>
        </header>

        <div class="board-wrap">
            <canvas id="canvas" width="720" height="540"></canvas>
            <div id="overlay" class="overlay visible">
                <h2 id="overlay-title">SODA SLINGER</h2>
                <p id="overlay-score"></p>
                <p id="overlay-sub">Press Space or click Start to open the bar</p>
                <button id="btn-start">Start Game</button>
            </div>
        </div>

        <div class="help">
            <p><kbd>&uarr;</kbd> <kbd>&darr;</kbd> / <kbd>W</kbd> <kbd>S</kbd> change counter</p>
            <p><kbd>Space</kbd> or click to pour</p>
            <p><kbd>P</kbd> pause</p>
            <p>Serve everyone before they reach the taps &mdash; and catch the empties they send back.</p>
        </div>
    </main>

    <script src="game.js"></script>
</body>
</html>
