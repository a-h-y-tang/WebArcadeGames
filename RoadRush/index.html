<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Road Rush</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <h1>Road Rush</h1>
        <div id="hud">
            <span>Score: <strong id="score">0</strong></span>
            <span>Best: <strong id="best">0</strong></span>
        </div>
        <div id="canvas-wrapper">
            <canvas id="canvas" width="400" height="600"></canvas>
            <div id="overlay" class="visible">
                <p id="overlay-title">Road Rush</p>
                <p id="overlay-score"></p>
                <p id="overlay-sub">Press an arrow key, A/D or Space to start</p>
                <button id="btn-start">Start Game</button>
            </div>
        </div>
        <p id="controls-hint">← → / A D to change lanes &nbsp;·&nbsp; P to pause</p>
    </div>
    <script src="game.js"></script>
    <script src="../shared/touch-controls.js"></script>
    <script>
        TouchControls.init({
            pad: 'leftright',
            swipe: { target: '#canvas', min: 20 },
            buttons: [{ label: '❚❚', key: 'p', aria: 'Pause', small: true }],
            hint: 'Swipe or tap ◀ ▶ to change lanes · ❚❚ pause',
            say: [['Press an arrow key, A/D or Space to start', 'Tap an arrow or Start'], [/Press Space/g, 'Tap Start'], [/Press P/g, 'Tap ❚❚']],
        });
    </script>
</body>
</html>
