<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BurgerTime</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <h1>BurgerTime</h1>
        <div id="hud">
            <span>Score: <strong id="score">0</strong></span>
            <span>Level: <strong id="level">1</strong></span>
            <span>Pepper: <strong id="pepper">5</strong></span>
            <span>Lives: <strong id="lives">3</strong></span>
            <span>Best: <strong id="best">0</strong></span>
        </div>
        <div id="canvas-wrapper">
            <canvas id="canvas" width="560" height="560"></canvas>
            <div id="overlay" class="visible">
                <p id="overlay-title">BurgerTime</p>
                <p id="overlay-score"></p>
                <p id="overlay-sub">Stomp every ingredient onto its plate — press Space to cook</p>
                <button id="btn-start">Start Game</button>
            </div>
        </div>
        <p id="controls-hint">← → walk &nbsp;·&nbsp; ↑ ↓ climb ladders &nbsp;·&nbsp; Space throws pepper &nbsp;·&nbsp; P to pause</p>
    </div>
    <script src="game.js"></script>
</body>
</html>
