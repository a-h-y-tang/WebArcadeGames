<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger Time</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <header class="hud">
            <h1>BURGER TIME</h1>
            <div class="stats">
                <div class="stat"><span class="label">Score</span><span id="score">0</span></div>
                <div class="stat"><span class="label">Level</span><span id="level">1</span></div>
                <div class="stat"><span class="label">Chefs</span><span id="lives">3</span></div>
                <div class="stat"><span class="label">Pepper</span><span id="peppers">5</span></div>
                <div class="stat"><span class="label">Best</span><span id="best">0</span></div>
            </div>
        </header>

        <div class="board-wrap">
            <canvas id="canvas" width="640" height="560"></canvas>
            <div id="overlay" class="overlay visible">
                <h2 id="overlay-title">BURGER TIME</h2>
                <p id="overlay-score"></p>
                <p id="overlay-sub">Press Space or Enter to start cooking</p>
                <button id="btn-start">Start Game</button>
            </div>
        </div>

        <div class="help">
            <p><kbd>←</kbd> <kbd>→</kbd> walk</p>
            <p><kbd>↑</kbd> <kbd>↓</kbd> climb ladders</p>
            <p><kbd>Space</kbd> throw pepper</p>
            <p><kbd>P</kbd> pause</p>
            <p>Walk the whole ingredient to drop it onto the plate</p>
        </div>
    </main>

    <script src="game.js"></script>
</body>
</html>
