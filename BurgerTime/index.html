<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BurgerTime</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <header class="hud">
            <h1>BURGERTIME</h1>
            <div class="stats">
                <div class="stat"><span class="label">Score</span><span id="score">0</span></div>
                <div class="stat"><span class="label">Level</span><span id="level">1</span></div>
                <div class="stat"><span class="label">Lives</span><span id="lives">3</span></div>
                <div class="stat"><span class="label">Pepper</span><span id="pepper">5</span></div>
                <div class="stat"><span class="label">Best</span><span id="best">0</span></div>
            </div>
        </header>

        <div class="board-wrap">
            <canvas id="canvas" width="560" height="460"></canvas>
            <div id="overlay" class="overlay visible">
                <h2 id="overlay-title">BURGERTIME</h2>
                <p id="overlay-score"></p>
                <p id="overlay-sub">Press Space or click Start to play</p>
                <button id="btn-start">Start Game</button>
            </div>
        </div>

        <div class="help">
            <p><kbd>←</kbd> <kbd>→</kbd> walk</p>
            <p><kbd>↑</kbd> <kbd>↓</kbd> climb</p>
            <p><kbd>Space</kbd> pepper</p>
            <p><kbd>P</kbd> pause</p>
        </div>
    </main>

    <script src="game.js"></script>
    <script src="../shared/touch-controls.js"></script>
    <script>
        TouchControls.init({
            pad: 'dpad',
            buttons: [
                { label: 'Pepper', key: ' ' },
                { label: '❚❚', key: 'p', aria: 'Pause', small: true },
            ],
            hint: 'Arrows walk and climb · Pepper sprays · ❚❚ pause',
            say: [['Press Space or Enter to play again', 'Tap Pepper to play again'], ['Press Space or click Start to play', 'Tap Pepper or Start to play'], [/Press Space/g, 'Tap Pepper'], [/Press P/g, 'Tap ❚❚'], [/Press Enter/g, 'Tap Start']],
        });
    </script>
</body>
</html>
