<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tapper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <header class="hud">
            <h1>TAPPER</h1>
            <div class="stats">
                <div class="stat"><span class="label">Score</span><span id="score">0</span></div>
                <div class="stat"><span class="label">Best</span><span id="high">0</span></div>
                <div class="stat"><span class="label">Shift</span><span id="level">1</span></div>
                <div class="stat"><span class="label">Bartenders</span><span id="lives">3</span></div>
            </div>
        </header>

        <div class="board-wrap">
            <canvas id="canvas" width="640" height="460"></canvas>
            <div id="overlay" class="overlay visible">
                <h2 id="overlay-title">TAPPER</h2>
                <p id="overlay-score"></p>
                <p id="overlay-sub">Press Space or click Start to open the bar</p>
                <button id="btn-start">Start Shift</button>
            </div>
        </div>

        <div class="help">
            <p><kbd>↑</kbd> <kbd>↓</kbd> change bar</p>
            <p><kbd>Space</kbd> pour a mug</p>
            <p><kbd>P</kbd> pause</p>
            <p>Serve them all — and catch the empties</p>
        </div>
    </main>

    <script src="game.js"></script>
</body>
</html>
