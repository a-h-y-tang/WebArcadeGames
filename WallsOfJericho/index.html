<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walls of Jericho</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <h1>Walls of Jericho</h1>
        <div id="hud">
            <span>Score: <strong id="score">0</strong></span>
            <span>Best: <strong id="best">0</strong></span>
            <span>Lives: <strong id="lives">3</strong></span>
            <span>Level: <strong id="level">1</strong></span>
        </div>
        <div id="canvas-wrapper">
            <canvas id="canvas" width="500" height="500"></canvas>
            <div id="overlay" class="visible">
                <p id="overlay-title">Walls of Jericho</p>
                <p id="overlay-score"></p>
                <p id="overlay-sub">Press Space or an arrow key to start</p>
                <button id="btn-start">Start Game</button>
            </div>
        </div>
        <p id="controls-hint">← → / A D / mouse &nbsp;·&nbsp; Space to launch &nbsp;·&nbsp; P to pause</p>
        <p class="verse">&ldquo;When the trumpets sounded, the army shouted, and the wall collapsed.&rdquo; &mdash; Joshua 6:20</p>
    </div>
    <script src="game.js"></script>
    <script src="../shared/touch-controls.js"></script>
    <script>
        TouchControls.init({
            pad: 'leftright',
            drag: '#canvas',
            buttons: [{ label: '❚❚', key: 'p', aria: 'Pause', small: true }],
            hint: 'Drag on the field or use ◀ ▶ to move · ❚❚ pause',
            say: [['Press Space or an arrow key to start', 'Tap Start or an arrow'], [/Press Space/g, 'Tap Start'], [/Press P/g, 'Tap ❚❚']],
        });
    </script>
</body>
</html>
