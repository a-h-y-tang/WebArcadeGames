<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tempest</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <h1>Tempest</h1>
        <div id="hud">
            <span>Score: <strong id="score">0</strong></span>
            <span>Best: <strong id="best">0</strong></span>
            <span>Lives: <strong id="lives">3</strong></span>
            <span>Level: <strong id="level">1</strong></span>
        </div>
        <div id="canvas-wrapper">
            <canvas id="canvas" width="600" height="600"></canvas>
            <div id="overlay" class="visible">
                <p id="overlay-title">Tempest</p>
                <p id="overlay-score"></p>
                <p id="overlay-sub">Press Space or an arrow key to start</p>
                <button id="btn-start">Start Game</button>
            </div>
        </div>
        <p id="controls-hint">
            ← → / A D to rotate &nbsp;·&nbsp; Space to fire &nbsp;·&nbsp;
            Z for superzapper &nbsp;·&nbsp; P to pause
        </p>
    </div>
    <script src="game.js"></script>
    <script src="../shared/touch-controls.js"></script>
    <script>
        TouchControls.init({
            pad: { kind: 'leftright', repeat: 120 },
            buttons: [{ label: 'Fire', key: ' ', repeat: 150 }, { label: 'Zap', key: 'z' }, { label: '❚❚', key: 'p', aria: 'Pause', small: true }],
            hint: '◀ ▶ rotate · Fire · Zap clears the tube · ❚❚ pause',
            say: [['Press Space or an arrow key to start', 'Tap Start or an arrow'], [/Press Space/g, 'Tap Start'], [/Press P/g, 'Tap ❚❚']],
        });
    </script>
</body>
</html>
