<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost Sheep</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <h1>Lost Sheep</h1>
        <div id="hud">
            <span>Score: <strong id="score">0</strong></span>
            <span>Best: <strong id="best">0</strong></span>
        </div>
        <div id="canvas-wrapper">
            <canvas id="canvas" width="500" height="500"></canvas>
            <div id="overlay" class="visible">
                <p id="overlay-title">Lost Sheep</p>
                <p id="overlay-score"></p>
                <p id="overlay-sub">Press an arrow key or WASD to start</p>
                <button id="btn-start">Start Game</button>
            </div>
        </div>
        <p id="controls-hint">Arrow keys / WASD &nbsp;·&nbsp; P to pause</p>
        <p class="verse">&ldquo;Rejoice with me; I have found my lost sheep.&rdquo; &mdash; Luke 15:6</p>
    </div>
    <script src="game.js"></script>
    <script src="../shared/touch-controls.js"></script>
    <script>
        TouchControls.init({
            pad: 'dpad',
            buttons: [{ label: '\u275A\u275A', key: 'p', aria: 'Pause' }],
            swipe: '#canvas',
            hint: 'Swipe or use the arrows \u00B7 \u275A\u275A to pause',
            say: [['Press an arrow key or WASD to start', 'Tap an arrow to start'],
                  ['Press an arrow key or WASD to play again', 'Tap an arrow to play again'],
                  ['Press P to resume', 'Tap \u275A\u275A to resume']],
        });
    </script>
</body>
</html>
