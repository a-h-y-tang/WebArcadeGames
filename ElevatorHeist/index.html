<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elevator Heist</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <header class="hud">
            <h1>ELEVATOR HEIST</h1>
            <div class="stats">
                <div class="stat"><span class="label">Score</span><span id="score">0</span></div>
                <div class="stat"><span class="label">Docs</span><span id="docs">0/3</span></div>
                <div class="stat"><span class="label">Level</span><span id="level">1</span></div>
                <div class="stat"><span class="label">Lives</span><span id="lives">3</span></div>
                <div class="stat"><span class="label">Best</span><span id="best">0</span></div>
            </div>
        </header>

        <div class="board-wrap">
            <canvas id="canvas" width="720" height="520"></canvas>
            <div id="overlay" class="overlay visible">
                <h2 id="overlay-title">ELEVATOR HEIST</h2>
                <p id="overlay-score"></p>
                <p id="overlay-sub">Press Space or click Start to play</p>
                <button id="btn-start">Start Game</button>
            </div>
        </div>

        <div class="help">
            <p><kbd>←</kbd> <kbd>→</kbd> run / leave car</p>
            <p><kbd>↑</kbd> ride / call up &middot; open door</p>
            <p><kbd>↓</kbd> ride / call down &middot; duck</p>
            <p><kbd>Space</kbd> <kbd>Z</kbd> fire</p>
            <p><kbd>P</kbd> pause</p>
        </div>
    </main>

    <script src="game.js"></script>
</body>
</html>
