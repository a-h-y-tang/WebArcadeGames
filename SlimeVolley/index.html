<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slime Volley</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <header class="hud">
            <h1>SLIME VOLLEY</h1>
            <div class="stats">
                <div class="stat"><span class="label">You</span><span id="score-p1">0</span></div>
                <div class="stat"><span class="label">Rival</span><span id="score-p2">0</span></div>
                <div class="stat"><span class="label">Rally</span><span id="rally">0</span></div>
                <div class="stat"><span class="label">Best Rally</span><span id="best">0</span></div>
            </div>
        </header>

        <div class="board-wrap">
            <canvas id="canvas" width="600" height="400"></canvas>
            <div id="overlay" class="overlay visible">
                <h2 id="overlay-title">SLIME VOLLEY</h2>
                <p id="overlay-score"></p>
                <p id="overlay-sub">Press Space or click Start to play</p>
                <button id="btn-start">Start Match</button>
            </div>
        </div>

        <div class="help">
            <p><kbd>←</kbd> <kbd>→</kbd> move</p>
            <p><kbd>↑</kbd> jump</p>
            <p><kbd>Space</kbd> start / jump</p>
            <p><kbd>P</kbd> pause</p>
            <p>First to 7 wins</p>
        </div>
    </main>

    <script src="game.js"></script>
</body>
</html>
