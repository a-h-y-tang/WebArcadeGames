<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keeper of the Garden</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <h1>Keeper of the Garden</h1>
        <div id="hud">
            <span>Score: <strong id="score">0</strong></span>
            <span>Best: <strong id="best">0</strong></span>
            <span>Lives: <strong id="lives">3</strong></span>
            <span>Level: <strong id="level">1</strong></span>
        </div>
        <div id="canvas-wrapper">
            <canvas id="canvas" width="500" height="600"
                    aria-label="The garden, with a caterpillar winding down through the thistles"></canvas>
            <div id="overlay" class="visible">
                <p id="overlay-title">Keeper of the Garden</p>
                <p id="overlay-score"></p>
                <p id="overlay-sub">Press Space or an arrow key to start</p>
                <button id="btn-start">Start Game</button>
            </div>
        </div>
        <p id="controls-hint">← → ↑ ↓ / W A S D move &nbsp;·&nbsp; Space to water (hold) &nbsp;·&nbsp; P to pause</p>
        <p class="verse">&ldquo;The LORD God took the man and put him in the garden of Eden to work it
            and keep it.&rdquo; &mdash; Genesis 2:15</p>
    </div>
    <script src="game.js"></script>
</body>
</html>
