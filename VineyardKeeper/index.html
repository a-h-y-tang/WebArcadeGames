<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vineyard Keeper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <h1>Vineyard Keeper</h1>
        <div id="hud">
            <span>Score: <strong id="score">0</strong></span>
            <span>Lives: <strong id="lives">3</strong></span>
            <span>Best: <strong id="best">0</strong></span>
        </div>
        <div id="canvas-wrapper">
            <canvas id="canvas" width="500" height="600"></canvas>
            <div id="overlay" class="visible">
                <p id="overlay-title">Vineyard Keeper</p>
                <p id="overlay-score"></p>
                <p id="overlay-sub">Move with arrows / WASD &nbsp;·&nbsp; Space to flick a pebble &nbsp;·&nbsp; press Space to start</p>
                <button id="btn-start">Start Game</button>
            </div>
        </div>
        <p id="controls-hint">Arrows / WASD to move &nbsp;·&nbsp; Space to flick a pebble &nbsp;·&nbsp; P to pause</p>
        <p class="verse">&ldquo;I will repay you for the years the locusts have eaten.&rdquo; &mdash; Joel 2:25</p>
    </div>
    <script src="game.js"></script>
</body>
</html>
