<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billiards</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <header class="hud">
            <h1>BILLIARDS</h1>
            <div class="stats">
                <div class="stat"><span class="label">Score</span><span id="score">0</span></div>
                <div class="stat"><span class="label">Rack</span><span id="rack">1</span></div>
                <div class="stat"><span class="label">Left</span><span id="left">10</span></div>
                <div class="stat"><span class="label">Shots</span><span id="shots">0</span></div>
                <div class="stat"><span class="label">Best</span><span id="best">0</span></div>
            </div>
        </header>

        <div class="board-wrap">
            <canvas id="canvas" width="720" height="400"></canvas>
            <div id="overlay" class="overlay visible">
                <h2 id="overlay-title">BILLIARDS</h2>
                <p id="overlay-score"></p>
                <p id="overlay-sub">Press Space or click Start to play</p>
                <button id="btn-start">Start Game</button>
            </div>
        </div>

        <div class="help">
            <p>move mouse to aim</p>
            <p><kbd>←</kbd> <kbd>→</kbd> fine aim</p>
            <p>hold <kbd>Space</kbd> or click to charge, release to shoot</p>
            <p><kbd>R</kbd> new game</p>
        </div>
    </main>

    <script src="game.js"></script>
</body>
</html>
