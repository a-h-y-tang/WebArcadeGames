<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Pilot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <header class="hud">
            <h1>TIME PILOT</h1>
            <div class="stats">
                <div class="stat"><span class="label">Score</span><span id="score">0</span></div>
                <div class="stat"><span class="label">Year</span><span id="year">1910</span></div>
                <div class="stat"><span class="label">Wave</span><span id="wave">1</span></div>
                <div class="stat"><span class="label">Lives</span><span id="lives">3</span></div>
                <div class="stat"><span class="label">Best</span><span id="best">0</span></div>
            </div>
        </header>

        <div class="board-wrap">
            <canvas id="canvas" width="640" height="640"></canvas>
            <div id="overlay" class="overlay visible">
                <h2 id="overlay-title">TIME PILOT</h2>
                <p id="overlay-score"></p>
                <p id="overlay-sub">Press Space or click Start to fly</p>
                <button id="btn-start">Start Game</button>
            </div>
        </div>

        <div class="help">
            <p><kbd>&larr;</kbd> <kbd>&rarr;</kbd> / <kbd>A</kbd> <kbd>D</kbd> turn &mdash; the world turns with you</p>
            <p><kbd>Space</kbd> or click to fire</p>
            <p><kbd>P</kbd> pause</p>
            <p>Fly into a parachute to rescue the pilot &mdash; 1000 points.</p>
        </div>
    </main>

    <script src="game.js"></script>
</body>
</html>
