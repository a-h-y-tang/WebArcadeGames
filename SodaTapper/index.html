<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soda Tapper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <header class="hud">
            <h1>SODA TAPPER</h1>
            <div class="stats">
                <div class="stat"><span class="label">Score</span><span id="score">0</span></div>
                <div class="stat"><span class="label">Wave</span><span id="level">1</span></div>
                <div class="stat"><span class="label">Lives</span><span id="lives">3</span></div>
                <div class="stat"><span class="label">Best</span><span id="best">0</span></div>
            </div>
        </header>

        <div class="board-wrap">
            <canvas id="canvas" width="720" height="460"></canvas>
            <div id="overlay" class="overlay visible">
                <h2 id="overlay-title">SODA TAPPER</h2>
                <p id="overlay-score"></p>
                <p id="overlay-sub">Press Space or click Start to play</p>
                <button id="btn-start">Start Game</button>
            </div>
        </div>

        <div class="help">
            <p><kbd>↑</kbd> <kbd>↓</kbd> change counter</p>
            <p><kbd>W</kbd> <kbd>S</kbd> change counter</p>
            <p><kbd>Space</kbd> pour a mug</p>
            <p><kbd>P</kbd> pause</p>
        </div>

        <p class="tip">Slide mugs down the counter to shove the crowd back out the door — then catch the empties before they hit the floor.</p>
    </main>

    <script src="game.js"></script>
</body>
</html>
