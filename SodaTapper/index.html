<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soda Tapper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <header class="hud">
            <h1>SODA TAPPER</h1>
            <div class="stats">
                <div class="stat"><span class="label">Score</span><span id="score">0</span></div>
                <div class="stat"><span class="label">Wave</span><span id="wave">1</span></div>
                <div class="stat"><span class="label">Lives</span><span id="lives">3</span></div>
                <div class="stat"><span class="label">Left</span><span id="left">5</span></div>
                <div class="stat"><span class="label">Best</span><span id="best">0</span></div>
            </div>
        </header>

        <div class="board-wrap">
            <canvas id="canvas" width="640" height="560"></canvas>
            <div id="overlay" class="overlay visible">
                <h2 id="overlay-title">SODA TAPPER</h2>
                <p id="overlay-score"></p>
                <p id="overlay-sub">Press Space or click Start to open the bar</p>
                <button id="btn-start">Start Game</button>
            </div>
        </div>

        <div class="help">
            <p><kbd>&uarr;</kbd> <kbd>&darr;</kbd> / <kbd>W</kbd> <kbd>S</kbd> / mouse &mdash; pick a lane</p>
            <p><kbd>Space</kbd> or click &mdash; pour and serve</p>
            <p><kbd>P</kbd> pause</p>
            <p>Push every drinker out the door &mdash; and catch the empties they slide back.</p>
        </div>
    </main>

    <script src="game.js"></script>
</body>
</html>
