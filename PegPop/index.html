<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peg Pop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <header class="hud">
            <h1>PEG POP</h1>
            <div class="stats">
                <div class="stat"><span class="label">Score</span><span id="score">0</span></div>
                <div class="stat"><span class="label">Level</span><span id="level">1</span></div>
                <div class="stat"><span class="label">Balls</span><span id="balls">10</span></div>
                <div class="stat"><span class="label">Orange</span><span id="pegs">0</span></div>
                <div class="stat"><span class="label">Best</span><span id="best">0</span></div>
            </div>
        </header>

        <div class="board-wrap">
            <canvas id="canvas" width="480" height="640"></canvas>
            <div id="overlay" class="overlay visible">
                <h2 id="overlay-title">PEG POP</h2>
                <p id="overlay-score"></p>
                <p id="overlay-sub">Press Space or click Start to play</p>
                <button id="btn-start">Start Game</button>
            </div>
        </div>

        <div class="help">
            <p><kbd>&larr;</kbd> <kbd>&rarr;</kbd> / <kbd>A</kbd> <kbd>D</kbd> / mouse aim</p>
            <p><kbd>Space</kbd> or click to fire</p>
            <p><kbd>P</kbd> pause</p>
            <p>Clear every orange peg &mdash; the bucket hands a ball back.</p>
        </div>
    </main>

    <script src="game.js"></script>
</body>
</html>
