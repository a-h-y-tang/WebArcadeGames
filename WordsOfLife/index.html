<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Words of Life</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <h1>Words of Life</h1>
        <div id="hud">
            <span>Score: <strong id="score">0</strong></span>
            <span>Best: <strong id="best">0</strong></span>
            <span>Lives: <strong id="lives">3</strong></span>
        </div>
        <div id="canvas-wrapper">
            <canvas id="canvas" width="700" height="560"></canvas>
            <div id="overlay" class="visible">
                <p id="overlay-title">Words of Life</p>
                <p id="overlay-score"></p>
                <p id="overlay-sub">Type the falling words. Press any letter to start</p>
                <button id="btn-start">Start Game</button>
            </div>
        </div>
        <p id="controls-hint">Type the letters of a falling word to catch it &nbsp;·&nbsp; Esc to pause</p>
        <p class="verse">&ldquo;Lord, to whom shall we go? You have the words of eternal life.&rdquo; &mdash; John 6:68</p>
    </div>
    <script src="game.js"></script>
    <script src="../shared/touch-controls.js"></script>
    <script>
        TouchControls.init({
            keypad: 'QWERTYUIOPASDFGHJKLZXCVBNM'.split('').map((c) => ({ key: c.toLowerCase(), label: c })),
            buttons: [{ label: '❚❚', key: 'Escape', aria: 'Pause', small: true }],
            hint: 'Tap the letters of a falling word to catch it · ❚❚ pause',
            say: [['Type the falling words.', 'Tap the letters of the falling words.'], [/Esc to (pause|resume)/gi, 'Tap ❚❚ to $1'], [/Press Esc/g, 'Tap ❚❚'], [/Type a letter/gi, 'Tap a letter'], [/Press any letter/gi, 'Tap a letter']],
        });
    </script>
</body>
</html>
