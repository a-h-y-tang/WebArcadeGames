<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cavern Raider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game">
        <header class="hud">
            <h1>CAVERN RAIDER</h1>
            <div class="stats">
                <div class="stat"><span class="label">Score</span><span id="score">0</span></div>
                <div class="stat"><span class="label">Best</span><span id="best">0</span></div>
                <div class="stat"><span class="label">Ships</span><span id="lives">3</span></div>
                <div class="stat"><span class="label">Depth</span><span id="level">1</span></div>
                <div class="stat fuel">
                    <span class="label">Fuel</span>
                    <span class="gauge"><span id="fuel-bar" style="width: 100.0%"></span></span>
                </div>
            </div>
        </header>

        <div class="board-wrap">
            <canvas id="canvas" width="720" height="440"></canvas>
            <div id="overlay" class="overlay visible">
                <h2 id="overlay-title">CAVERN RAIDER</h2>
                <p id="overlay-score"></p>
                <p id="overlay-sub">Press Space or click Launch to fly</p>
                <button id="btn-start">Launch</button>
            </div>
        </div>

        <div class="help">
            <p><kbd>←</kbd> <kbd>→</kbd> <kbd>↑</kbd> <kbd>↓</kbd> fly</p>
            <p><kbd>Space</kbd> laser</p>
            <p><kbd>X</kbd> bomb</p>
            <p><kbd>P</kbd> pause</p>
            <p>Shoot fuel tanks to top up the tank</p>
        </div>
    </main>

    <script src="game.js"></script>
</body>
</html>
